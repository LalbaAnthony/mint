worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
  }

  log_format json escape=json
    '{"time":"$time_iso8601","level":"info","event":"web_request",'
    '"method":"$request_method","path":"$request_path","status":$status,'
    '"bytes":$body_bytes_sent,"duration_seconds":$request_time,'
    '"user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /healthz {
      access_log off;
      return 204;
    }

    location ^~ /_nuxt/ {
      include /etc/nginx/snippets/security-headers.conf;
      include /etc/nginx/snippets/content-security-policy.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location ^~ /_fonts/ {
      include /etc/nginx/snippets/security-headers.conf;
      include /etc/nginx/snippets/content-security-policy.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/snippets/security-headers.conf;
      include /etc/nginx/snippets/content-security-policy.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /200.html;
    }
  }
}
