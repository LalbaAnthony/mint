# Reference only: NOT generated nor deployed automatically. Keep it identical to the server vhost.
# Required modules: a2enmod http2 ssl rewrite proxy proxy_http headers
# Ports 4568 (api) and 4569 (web) must match the GitHub secrets API_HOST_PORT and WEB_HOST_PORT.
# Procedure and rationale: docs/deployment.md, section 5.

<VirtualHost *:80>
    ServerName mint.dev-it.app

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://mint.dev-it.app%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName mint.dev-it.app

    Protocols h2 http/1.1
    ProtocolsHonorOrder On

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass /api/ http://127.0.0.1:4568/api/
    ProxyPassReverse /api/ http://127.0.0.1:4568/api/

    ProxyPass / http://127.0.0.1:4569/
    ProxyPassReverse / http://127.0.0.1:4569/

    # Page headers (CSP included) come from the web container: never set them here for /
    <Location /api/>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "no-referrer"
    </Location>

    Header always set Strict-Transport-Security "max-age=63072000"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/mint.dev-it.app/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mint.dev-it.app/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder Off
    SSLSessionTickets Off

    # combined without the query string, which may carry user data (NF-SEC-06)
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" mint_combined
    ErrorLog ${APACHE_LOG_DIR}/mint-prod_error.log
    CustomLog ${APACHE_LOG_DIR}/mint-prod_access.log mint_combined
</VirtualHost>
