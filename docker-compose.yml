name: mint

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-database-healthcheck: &database-healthcheck
  test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
  interval: 5s
  timeout: 3s
  retries: 10

x-api-environment: &api-environment
  TZ: Europe/Paris
  PORT: 3000
  DATABASE_PORT: 5432
  DATABASE_NAME: ${POSTGRES_DB}
  DATABASE_USER: ${POSTGRES_USER}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
  SESSION_SECRET: ${SESSION_SECRET}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}

x-worker-environment: &worker-environment
  TZ: Europe/Paris
  DATABASE_PORT: 5432
  DATABASE_NAME: ${POSTGRES_DB}
  DATABASE_USER: ${POSTGRES_USER}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}

x-api-healthcheck: &api-healthcheck
  test:
    - CMD
    - node
    - -e
    - "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))"
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 15s

services:
  db:
    profiles: [prod]
    image: postgres:18-alpine
    restart: unless-stopped
    environment: *database-environment
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck: *database-healthcheck
    logging: *json-logging

  api:
    profiles: [prod]
    image: ${API_IMAGE}
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    restart: unless-stopped
    environment:
      <<: *api-environment
      DATABASE_HOST: db
      APP_ORIGIN: https://mint.dev-it.app
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
    ports:
      - 127.0.0.1:${API_HOST_PORT}:3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *api-healthcheck
    logging: *json-logging

  worker:
    profiles: [prod]
    image: ${API_IMAGE}
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      <<: *worker-environment
      DATABASE_HOST: db
      HEALTHCHECK_EXECUTION_URL: ${HEALTHCHECK_EXECUTION_URL:-}
      HEALTHCHECK_PURGE_URL: ${HEALTHCHECK_PURGE_URL:-}
      HEALTHCHECK_NOTIFICATIONS_URL: ${HEALTHCHECK_NOTIFICATIONS_URL:-}
    depends_on:
      db:
        condition: service_healthy
    logging: *json-logging

  web:
    profiles: [prod]
    image: ${WEB_IMAGE}
    build:
      context: .
      dockerfile: front/Dockerfile.prod
    restart: unless-stopped
    ports:
      - 127.0.0.1:${WEB_HOST_PORT}:8080
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *json-logging

  db-dev:
    profiles: [dev]
    image: postgres:18-alpine
    environment: *database-environment
    ports:
      - 127.0.0.1:${DB_HOST_PORT}:5432
    volumes:
      - db-dev-data:/var/lib/postgresql
    healthcheck: *database-healthcheck

  api-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    environment:
      <<: *api-environment
      DATABASE_HOST: db-dev
      APP_ORIGIN: http://localhost:${WEB_HOST_PORT}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS_MODE: none
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      MAIL_FROM: Mint <no-reply@mint.localhost>
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - 127.0.0.1:${API_HOST_PORT}:3000
    volumes:
      - ./api:/app/api
      - ./shared:/app/shared
      - /app/api/node_modules
    depends_on:
      db-dev:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck: *api-healthcheck

  worker-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    command: ['npm', 'run', 'worker:dev']
    environment:
      <<: *worker-environment
      DATABASE_HOST: db-dev
      HEALTHCHECK_EXECUTION_URL: ''
      HEALTHCHECK_PURGE_URL: ''
      HEALTHCHECK_NOTIFICATIONS_URL: ''
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./api:/app/api
      - ./shared:/app/shared
      - /app/api/node_modules
    depends_on:
      db-dev:
        condition: service_healthy

  web-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: front/Dockerfile.dev
    environment:
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: ${WEB_HOST_PORT}
      MINT_DEV_API_ORIGIN: http://api-dev:3000
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - 127.0.0.1:${WEB_HOST_PORT}:${WEB_HOST_PORT}
    volumes:
      - ./front:/app/front
      - ./shared:/app/shared
      - /app/front/node_modules
      - /app/front/.nuxt
    depends_on:
      api-dev:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:${WEB_HOST_PORT}/').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 120s

  mailpit:
    profiles: [dev]
    image: axllent/mailpit:v1.31.3
    ports:
      - 127.0.0.1:${MAILPIT_UI_PORT}:8025

volumes:
  db-data:
  db-dev-data:
