name: tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: mint
      POSTGRES_USER: mint
      POSTGRES_PASSWORD: mint-ci-only
      DB_HOST_PORT: 5432
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mint
          POSTGRES_USER: mint
          POSTGRES_PASSWORD: mint-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mint -d mint"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Vitest with coverage
        run: npm run test:coverage

      - name: Coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Start the end-to-end stack
        run: docker compose -f e2e/compose.yml up --build --detach --wait --wait-timeout 300

      - name: Playwright
        run: npm run test:e2e

      - name: Stack logs
        if: ${{ failure() }}
        run: docker compose -f e2e/compose.yml logs --no-color

      - name: Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop the end-to-end stack
        if: ${{ always() }}
        run: docker compose -f e2e/compose.yml down --volumes
